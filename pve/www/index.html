<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dionysus PVE Manager</title>
  <style>
    :root {
      --chrome: #1f2933;
      --chrome-dark: #111827;
      --panel: #f5f7fa;
      --border: #c7d0d9;
      --text: #17202a;
      --muted: #637083;
      --blue: #2563eb;
      --green: #16803c;
      --warn: #b45309;
      --bad: #b91c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e7ebf0;
      color: var(--text);
      font: 13px/1.4 Arial, Helvetica, sans-serif;
    }

    .topbar {
      align-items: center;
      background: linear-gradient(#2d3748, var(--chrome-dark));
      border-bottom: 1px solid #0f172a;
      color: #f8fafc;
      display: flex;
      height: 44px;
      justify-content: space-between;
      padding: 0 12px;
    }

    .brand {
      font-size: 17px;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      gap: 8px;
    }

    button {
      background: linear-gradient(#ffffff, #d8dee7);
      border: 1px solid #9aa7b5;
      border-radius: 2px;
      color: #1f2937;
      cursor: pointer;
      font: inherit;
      padding: 5px 10px;
    }

    button.primary {
      background: linear-gradient(#3b82f6, #1d4ed8);
      border-color: #1d4ed8;
      color: #fff;
    }

    .layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      height: calc(100vh - 44px);
    }

    .tree {
      background: #eef2f7;
      border-right: 1px solid var(--border);
      overflow: auto;
      padding: 8px;
    }

    .tree-title {
      color: var(--muted);
      font-weight: 700;
      margin: 8px 4px;
      text-transform: uppercase;
    }

    .tree-node {
      border: 1px solid transparent;
      border-radius: 2px;
      padding: 6px 8px;
    }

    .tree-node.active {
      background: #dbeafe;
      border-color: #93c5fd;
    }

    .content {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .tabs {
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 2px;
      padding: 6px 8px 0;
    }

    .tab {
      background: #e8edf3;
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: 3px 3px 0 0;
      padding: 7px 12px;
    }

    .tab.active {
      background: #fff;
      font-weight: 700;
    }

    .panes {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      overflow: auto;
      padding: 10px;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 2px;
      min-height: 180px;
    }

    .panel.wide {
      grid-column: 1 / -1;
    }

    .panel h2 {
      background: linear-gradient(#f8fafc, #e5eaf1);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      margin: 0;
      padding: 8px 10px;
    }

    .panel-body {
      padding: 10px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    td,
    th {
      border-bottom: 1px solid #e5e7eb;
      padding: 7px 6px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 700;
    }

    .state-ok {
      color: var(--green);
      font-weight: 700;
    }

    .state-warn {
      color: var(--warn);
      font-weight: 700;
    }

    .state-bad {
      color: var(--bad);
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .layout,
      .panes {
        grid-template-columns: 1fr;
      }

      .tree {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Dionysus PVE Manager</div>
    <div class="toolbar">
      <button id="refresh">Refresh</button>
      <button id="optimize" class="primary">Apply Ollama KV-cache Profile</button>
    </div>
  </header>

  <main class="layout">
    <aside class="tree">
      <div class="tree-title">Datacenter</div>
      <div class="tree-node active">▾ localhost</div>
      <div class="tree-node">　▸ QEMU</div>
      <div class="tree-node">　▸ LXC</div>
      <div class="tree-node">　▸ Ollama</div>
      <div class="tree-node">　▸ Swap</div>
      <div class="tree-node">　▸ Services</div>
    </aside>

    <section class="content">
      <nav class="tabs">
        <div class="tab active">Summary</div>
        <div class="tab">Local LLM</div>
        <div class="tab">Services</div>
        <div class="tab">Tasks</div>
      </nav>

      <div class="panes">
        <section class="panel">
          <h2>Node Status</h2>
          <div class="panel-body">
            <table>
              <tbody id="node-status"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <h2>Ollama KV-cache Posture</h2>
          <div class="panel-body">
            <table>
              <tbody id="ollama-status"></tbody>
            </table>
          </div>
        </section>

        <section class="panel wide">
          <h2>Recommendations</h2>
          <div class="panel-body">
            <table>
              <thead>
                <tr><th>Severity</th><th>Finding</th><th>Action</th></tr>
              </thead>
              <tbody id="recommendations"></tbody>
            </table>
          </div>
        </section>

        <section class="panel wide">
          <h2>Services</h2>
          <div class="panel-body">
            <table>
              <thead>
                <tr><th>Name</th><th>State</th></tr>
              </thead>
              <tbody id="services"></tbody>
            </table>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    function bytes(value) {
      if (!value) return '0 B';
      const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
      let current = value;
      let index = 0;
      while (current >= 1024 && index < units.length - 1) {
        current /= 1024;
        index += 1;
      }
      return `${current.toFixed(index ? 2 : 0)} ${units[index]}`;
    }

    function row(label, value) {
      return `<tr><th>${label}</th><td>${value}</td></tr>`;
    }

    function serviceClass(state) {
      if (state === 'active' || state === 'online') return 'state-ok';
      if (state === 'inactive' || state === 'unknown') return 'state-warn';
      return 'state-bad';
    }

    async function api(path, init) {
      const response = await fetch(path, init);
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(JSON.stringify(payload.errors || payload));
      }
      return payload.data;
    }

    async function refresh() {
      const [node, ollama, services] = await Promise.all([
        api('/api2/json/nodes/localhost/status'),
        api('/api2/json/nodes/localhost/ollama/status'),
        api('/api2/json/nodes/localhost/services')
      ]);

      document.getElementById('node-status').innerHTML = [
        row('Node', node.node),
        row('Uptime', `${Math.floor(node.uptime)}s`),
        row('Memory used', `${bytes(node.memory.used)} / ${bytes(node.memory.total)}`),
        row('Swap used', `${bytes(node.swap.used)} / ${bytes(node.swap.total)}`),
        row('Load', (node.loadavg || []).join(' '))
      ].join('');

      document.getElementById('ollama-status').innerHTML = [
        row('API', ollama.apiReachable ? '<span class="state-ok">reachable</span>' : '<span class="state-warn">unreachable</span>'),
        row('Models', String((ollama.models || []).length)),
        row('Processes', String((ollama.processes || []).length)),
        row('Swappiness', ollama.kernel.swappiness || '--'),
        row('Page cluster', ollama.kernel.pageCluster || '--'),
        row('THP', ollama.kernel.transparentHugepage || '--')
      ].join('');

      document.getElementById('recommendations').innerHTML = (ollama.recommendations || []).map((item) => `
        <tr>
          <td class="${item.severity === 'warning' ? 'state-warn' : 'muted'}">${item.severity}</td>
          <td>${item.text}</td>
          <td>${item.action}</td>
        </tr>
      `).join('') || '<tr><td colspan="3" class="muted">No recommendations.</td></tr>';

      document.getElementById('services').innerHTML = (services || []).map((service) => `
        <tr><td>${service.name}</td><td class="${serviceClass(service.state)}">${service.state}</td></tr>
      `).join('');
    }

    async function optimize() {
      await api('/api2/json/nodes/localhost/ollama/optimize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({})
      });
      await refresh();
    }

    document.getElementById('refresh').addEventListener('click', () => refresh().catch(console.error));
    document.getElementById('optimize').addEventListener('click', () => optimize().catch((error) => alert(error.message)));
    refresh().catch(console.error);
    window.setInterval(() => refresh().catch(console.error), 5000);
  </script>
</body>
</html>
